<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HAMZA</title>

<style>
:root {
    --bg: #030508;
    --panel: rgba(11, 16, 24, .92);
    --panel-light: rgba(255,255,255,.045);
    --border: rgba(255,255,255,.09);

    --text: #f7f9fc;
    --muted: #7f8a9a;

    --blue: #4aa3ff;
    --blue-dark: #1269d9;

    --green: #48e08a;
    --yellow: #ffd166;
    --red: #ff5f6d;
}

/* =========================
   BASE
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
}

body {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        system-ui,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% -15%,
            rgba(35,105,180,.30),
            transparent 42%
        ),
        radial-gradient(
            circle at 100% 100%,
            rgba(20,80,140,.13),
            transparent 35%
        ),
        #030508;
}

/* Subtle grid */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    opacity: .18;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 85%
        );
}

/* Ambient glow */

body::after {
    content: "";

    position: fixed;

    width: 500px;
    height: 500px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    pointer-events: none;

    background:
        radial-gradient(
            circle,
            rgba(30,130,255,.07),
            transparent 70%
        );
}

/* =========================
   APP
========================= */

#app {
    width: min(92vw, 560px);

    position: relative;

    z-index: 2;
}

/* =========================
   HEADER
========================= */

#brand {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 14px;

    margin-bottom: 20px;
}

/* HAMZA logo */

.logo {
    width: 48px;
    height: 48px;

    display: grid;
    place-items: center;

    border-radius: 15px;

    position: relative;

    background:
        linear-gradient(
            145deg,
            #2997ff,
            #0754b8
        );

    box-shadow:
        0 0 35px rgba(30,135,255,.28),
        inset 0 1px 1px rgba(255,255,255,.28);
}

.logo::before {
    content: "H";

    color: white;

    font-size: 23px;
    font-weight: 900;

    letter-spacing: -.08em;
}

.logo::after {
    content: "";

    position: absolute;

    inset: 1px;

    border-radius: 14px;

    border: 1px solid rgba(255,255,255,.15);
}

/* Brand text */

.brand-text {
    display: flex;
    flex-direction: column;
}

.brand-text b {
    font-size: 21px;

    font-weight: 850;

    letter-spacing: .20em;
}

.brand-text span {
    margin-top: 3px;

    color: var(--muted);

    font-size: 9px;

    font-weight: 600;

    letter-spacing: .28em;

    text-transform: uppercase;
}

/* =========================
   MAIN CARD
========================= */

.card {
    position: relative;

    overflow: hidden;

    padding: 30px;

    border-radius: 26px;

    border: 1px solid var(--border);

    background:
        linear-gradient(
            145deg,
            rgba(17,24,34,.96),
            rgba(6,9,14,.97)
        );

    box-shadow:
        0 35px 100px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.05);

    backdrop-filter: blur(22px);
}

/* Top light */

.card::before {
    content: "";

    position: absolute;

    top: 0;
    left: 15%;
    right: 15%;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(70,160,255,.9),
            transparent
        );

    box-shadow:
        0 0 15px rgba(70,160,255,.5);
}

/* Decorative corner */

.card::after {
    content: "";

    position: absolute;

    width: 120px;
    height: 120px;

    right: -60px;
    top: -60px;

    border-radius: 50%;

    border: 1px solid rgba(70,160,255,.08);
}

/* =========================
   SYSTEM LABEL
========================= */

.system-label {
    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 18px;

    color: #667386;

    font-size: 9px;

    font-weight: 700;

    letter-spacing: .18em;

    text-transform: uppercase;
}

.system-label::before {
    content: "";

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: var(--blue);

    box-shadow:
        0 0 10px var(--blue);
}

/* =========================
   STATUS
========================= */

.status-row {
    display: flex;

    align-items: center;

    gap: 14px;
}

.status-dot {
    flex-shrink: 0;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: var(--blue);

    box-shadow:
        0 0 0 6px rgba(74,163,255,.08),
        0 0 22px rgba(74,163,255,.75);

    animation:
        pulse 1.8s infinite;
}

@keyframes pulse {

    0%,
    100% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: .5;
        transform: scale(.82);
    }
}

#state {
    margin: 0;

    font-size: 26px;

    line-height: 1.15;

    font-weight: 780;

    letter-spacing: -.035em;
}

/* =========================
   INFORMATION
========================= */

.info {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 15px;

    margin-top: 24px;

    padding: 17px 18px;

    border-radius: 16px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid rgba(255,255,255,.06);
}

.info-label {
    color: #6f7b8c;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: .15em;

    text-transform: uppercase;
}

#det {
    font-size: 13px;

    text-align: right;
}

#det b {
    font-weight: 750;
}

/* =========================
   STATUS COLORS
========================= */

.ok {
    color: var(--green);

    text-shadow:
        0 0 12px rgba(72,224,138,.25);
}

.bad {
    color: var(--red);

    text-shadow:
        0 0 12px rgba(255,95,109,.25);
}

.warn {
    color: var(--yellow);
}

/* =========================
   CACHE
========================= */

.cache-box {
    margin-top: 18px;
}

#cache {
    min-height: 18px;

    color: #6f7b8b;

    font-size: 11px;

    letter-spacing: .02em;
}

#cache.cacheok {
    color: var(--green);
}

/* Progress */

.progress {
    position: relative;

    height: 4px;

    margin-top: 10px;

    overflow: hidden;

    border-radius: 99px;

    background:
        rgba(255,255,255,.055);
}

.progress-bar {
    width: 0%;
    height: 100%;

    border-radius: inherit;

    background:
        linear-gradient(
            90deg,
            var(--blue-dark),
            var(--blue)
        );

    box-shadow:
        0 0 12px rgba(74,163,255,.55);

    transition:
        width .25s ease;
}

/* =========================
   TAP AREA
========================= */

.tap-area {
    margin-top: 22px;

    padding: 14px;

    text-align: center;

    border-radius: 14px;

    border:
        1px solid rgba(74,163,255,.16);

    background:
        rgba(74,163,255,.035);

    color: #7c899b;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: .12em;

    animation:
        fadeIn .35s ease;
}

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(6px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   FOOTER
========================= */

.footer {
    margin-top: 16px;

    text-align: center;

    color: #414b5a;

    font-size: 9px;

    font-weight: 600;

    letter-spacing: .20em;

    text-transform: uppercase;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

    #app {
        width: 92vw;
    }

    .card {
        padding: 24px;

        border-radius: 21px;
    }

    #state {
        font-size: 22px;
    }

    .brand-text b {
        font-size: 18px;
    }

    .logo {
        width: 43px;
        height: 43px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- BRAND -->

    <div id="brand">

        <div class="logo"></div>

        <div class="brand-text">

            <b>HAMZA</b>

            <span>
                System Interface
            </span>

        </div>

    </div>


    <!-- MAIN -->

    <div class="card">

        <div class="system-label">
            Console Environment
        </div>


        <div class="status-row">

            <div class="status-dot"></div>

            <div id="state">
                Detecting firmware...
            </div>

        </div>


        <div class="info">

            <span class="info-label">
                Console
            </span>

            <div id="det">
                Scanning...
            </div>

        </div>


        <div class="cache-box">

            <div id="cache">
                Initialising cache...
            </div>

            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar">
                </div>

            </div>

        </div>


        <div
            id="tap"
            class="tap-area"
            style="display:none;">

            PRESS X OR TAP TO CONTINUE

        </div>

    </div>


    <div class="footer">
        HAMZA • Offline System Interface
    </div>

</div>


<script>
(function () {

    var stateEl =
        document.getElementById("state");

    var detEl =
        document.getElementById("det");

    var cacheEl =
        document.getElementById("cache");

    var progressEl =
        document.getElementById("progressBar");

    var tapEl =
        document.getElementById("tap");


    function setState(t, c) {

        stateEl.textContent = t;

        stateEl.className = c || "";

    }


    function setCache(t, ok) {

        cacheEl.textContent = t;

        cacheEl.className =
            ok ? "cacheok" : "";

    }


    function setProgress(value) {

        value =
            Math.max(
                0,
                Math.min(100, value)
            );

        progressEl.style.width =
            value + "%";

    }


    var params =
        new URLSearchParams(
            location.search
        );


    /*
     * Firmware table.
     *
     * Keep this synchronized
     * with ps4_offsets.js.
     */

    var SUPPORTED = {

        1302: 1,
        1304: 1,
        1350: 1,
        1352: 1

    };


    var key = null;

    var fwnum = null;


    var m =
        /PlayStation\s+4[\/ ](\d+)\.(\d+)/
        .exec(
            navigator.userAgent
        );


    if (m) {

        var ms =
            parseInt(
                m[2],
                16
            ).toString(16);


        if (ms.length < 2)
            ms = "0" + ms;


        key =
            m[1] +
            "." +
            ms;


        fwnum =
            parseInt(
                m[1],
                10
            ) * 100
            +
            parseInt(
                ms,
                10
            );

    }


    var forced =
        params.get("force") === "1";


    var supported =
        forced ||
        (
            fwnum !== null &&
            SUPPORTED[fwnum] === 1
        );


    detEl.innerHTML =
        "Firmware <b>" +
        (key || "UNKNOWN") +
        "</b>" +

        (
            supported

            ? ' <span class="ok">• SUPPORTED</span>'

            : ' <span class="bad">• NOT SUPPORTED</span>'
        );


    var target =
        "jb.html" +
        location.search;


    function go() {

        setState(
            "Loading...",
            "warn"
        );

        tapEl.style.display =
            "none";

        location.replace(
            target
        );

    }


    function waitForTap(
        msg,
        action
    ) {

        setState(
            msg,
            "warn"
        );

        tapEl.style.display =
            "block";


        function fire() {

            window.removeEventListener(
                "click",
                fire
            );

            window.removeEventListener(
                "keydown",
                fire
            );

            action();

        }


        window.addEventListener(
            "click",
            fire
        );


        window.addEventListener(
            "keydown",
            fire
        );

    }


    /*
     * Unsupported firmware
     */

    if (!supported) {

        setState(
            "Unsupported Firmware",
            "bad"
        );


        waitForTap(
            "Press X or tap to run anyway",
            go
        );


        return;

    }


    /*
     * Application cache
     */

    var ac =
        window.applicationCache;


    if (
        !ac ||
        !document.documentElement
            .hasAttribute(
                "manifest"
            )
    ) {

        go();

    }

    else if (!navigator.onLine) {

        setCache(
            "Offline • using cached version",
            true
        );

        setProgress(100);

        go();

    }

    else if (ac.status === ac.IDLE) {

        setCache(
            "Cached • offline ready",
            true
        );

        setProgress(100);

        go();

    }

    else if (
        ac.status === ac.UPDATEREADY
    ) {

        try {

            ac.swapCache();

        } catch (e) {}


        setCache(
            "Update downloaded",
            true
        );

        setProgress(100);


        waitForTap(
            "Update ready • Press X or tap to reload",

            function () {

                location.reload();

            }
        );

    }

    else {

        setCache(
            "Checking offline cache..."
        );


        ac.addEventListener(
            "downloading",

            function () {

                setCache(
                    "Caching for offline use..."
                );

                setProgress(5);

            },

            false
        );


        ac.addEventListener(
            "progress",

            function (e) {

                if (e && e.total) {

                    var percent =
                        Math.round(
                            (
                                e.loaded /
                                e.total
                            ) * 100
                        );


                    setCache(
                        "Caching • " +
                        percent +
                        "%"
                    );


                    setProgress(
                        percent
                    );

                }

            },

            false
        );


        ac.addEventListener(
            "cached",

            function () {

                setCache(
                    "Cached • offline ready",
                    true
                );

                setProgress(100);


                waitForTap(
                    "Cached • Press X or tap to run",
                    go
                );

            },

            false
        );


        ac.addEventListener(
            "updateready",

            function () {

                try {

                    ac.swapCache();

                } catch (e) {}


                setCache(
                    "Update downloaded",
                    true
                );

                setProgress(100);


                waitForTap(
                    "Update ready • Press X or tap to reload",

                    function () {

                        location.reload();

                    }
                );

            },

            false
        );


        ac.addEventListener(
            "noupdate",

            function () {

                setCache(
                    "Cached • offline ready",
                    true
                );

                setProgress(100);

                go();

            },

            false
        );


        ac.addEventListener(
            "error",

            function () {

                setCache(
                    "Cache unavailable"
                );

                setProgress(0);


                waitForTap(
                    "Cache failed • Press X or tap to run anyway",
                    go
                );

            },

            false
        );


        ac.addEventListener(
            "obsolete",

            function () {

                setCache(
                    "Cache obsolete"
                );

                setProgress(0);


                waitForTap(
                    "Cache obsolete • Press X or tap to run",
                    go
                );

            },

            false
        );

    }

})();
</script>

</body>
</html>
